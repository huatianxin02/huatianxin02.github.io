<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>相册 | 华天心的个人主页</title>
  <meta name="description" content="华天心的相册。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- 导航栏（和首页一致） -->
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="index.html">华天心</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="index.html#about">关于我</a>
        <a href="index.html#skills">技能</a>
        <a href="index.html#projects">作品</a>
        <a href="blog.html">文章</a>
        <a href="gallery.html">相册</a>
        <a href="index.html#contact">联系我</a>
      </nav>
      <div class="nav-right">
        <button class="theme-toggle" aria-label="切换深色模式">🌙</button>
        <button class="nav-toggle" aria-label="打开菜单">☰</button>
      </div>
    </div>
  </header>

  <!-- 页面标题 -->
  <section class="page-hero">
    <div class="container">
      <h1>📷 我的相册</h1>
      <p>记录生活中的美好瞬间</p>
    </div>
  </section>

  <!-- 相册网格 -->
  <section class="section">
    <div class="container">
      <div class="gallery-grid">

        <!-- ↓↓↓ 一张照片：想加就复制一段 <figure class="gallery-item">...</figure>，想删就删掉 ↓↓↓
             把 images/gallery1.svg 换成你自己的照片文件即可 -->
        <figure class="gallery-item">
          <img src="images/gallery1.svg" alt="照片一" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/gallery2.svg" alt="照片二" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/gallery3.svg" alt="照片三" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/gallery4.svg" alt="照片四" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/gallery5.svg" alt="照片五" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="images/gallery6.svg" alt="照片六" />
          <figcaption class="gallery-caption">这里写照片说明</figcaption>
        </figure>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2024 华天心 · 用 ❤️ 制作</p>
    </div>
  </footer>

  <button id="backToTop" aria-label="返回顶部">↑</button>

  <script src="assets/js/main.js"></script>
</body>
</html>
